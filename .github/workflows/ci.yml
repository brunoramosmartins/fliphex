name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The Phase 1 engine imports only the standard library, and conftest.py
      # puts the repo root and scripts/ on sys.path, so ruff + pytest are all
      # CI needs. Add project deps here as later phases require them.
      - name: Install tools
        run: python -m pip install --upgrade "ruff>=0.4" "pytest>=8.0"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: Generated docs are up to date
        run: |
          python scripts/build_docs.py
          git diff --exit-code docs/ \
            || (echo "::error::docs/ is stale — rerun scripts/build_docs.py" && exit 1)
