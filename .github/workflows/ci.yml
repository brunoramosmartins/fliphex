name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # Axis 1's exact solver runs under an interpreter with no torch build, and
  # agents/__init__.py is written so that importing a non-AZ agent never pulls
  # torch in. That is a supported configuration, so it is a CI job: this one
  # proves the engine, the solver and the non-AZ agents still stand up without
  # the optional extra. The az test modules are skipped whole by conftest.py,
  # which prints a header saying so.
  check:
    name: engine + solver (no torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Tests
        run: pytest

      - name: Generated docs are up to date
        run: |
          python scripts/build_docs.py
          git diff --exit-code docs/ \
            || (echo "::error::docs/ is stale — rerun scripts/build_docs.py" && exit 1)

      # The other half of the same rule, and it was missing.
      #
      # `web/payload.json`, `web/geometry.json` and `web/theme.css` are generated
      # from `fliphex/`, `solver/`, `agents/` and `ui/theme.py` exactly as
      # `docs/` is generated from the engine — but only the Pages workflow was
      # checking them, and that runs on `main` *after* a merge. So a stale
      # payload passed every branch check and failed at deploy, which is the
      # wrong end of the pipeline to find out that the published page would be
      # running code this commit does not contain.
      #
      # It happened: `ui/seats.py` is one of the 24 bundled modules, a fix to it
      # merged green, and the deployment was the first thing to object.
      - name: Generated web bundle is up to date
        run: |
          python scripts/build_web.py --check \
            || (echo "::error::web/ is stale — rerun scripts/build_web.py" && exit 1)

  # Everything the first job skips. Torch is installed from the CPU-only index:
  # the default wheel carries a CUDA runtime worth hundreds of megabytes, and no
  # GPU is reachable here or on the author's machine (R8 — the 462-series
  # Windows driver predates WSL2 CUDA), so the CPU build is what actually runs.
  az:
    name: az package (torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install, with CPU-only torch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,az]"

      - name: Confirm this job is actually testing what the other one skipped
        run: |
          python -c "import torch; print('torch', torch.__version__)"
          pytest --collect-only -q tests/test_az_network.py > /dev/null \
            || (echo "::error::the az modules did not collect — this job proves nothing" && exit 1)

      - name: Tests
        run: pytest
